<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020713">
  <title>ONYX NOVA | Offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #01050e; color: #e9f8ff; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }

    p { color: #a7c1d1; line-height: 1.5; }
    button { border: 1px solid #2c7898; border-radius: 999px; padding: 10px 16px; background: #061522; color: #e9f8ff; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>ONYX NOVA</h1>
    <p>Connection unavailable. No request was executed while offline.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
