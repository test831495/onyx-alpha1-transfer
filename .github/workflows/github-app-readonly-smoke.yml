name: GitHub App Read-Only Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_PRIVATE_KEY_GITHUB: ${{ secrets.APP_PRIVATE_KEY_GITHUB }}
      APP_ID_GITHUB: ${{ secrets.APP_ID_GITHUB }}
      APP_INSTALLATION_ID_GITHUB: ${{ vars.APP_INSTALLATION_ID_GITHUB }}
      GITHUB_OWNER: test831495
      GITHUB_REPOSITORY_NAME: onyx-alpha1-transfer
      EVIDENCE_PATH: github-app-readonly-smoke-evidence.json
    steps:
      - name: Checkout Track A
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run bounded read-only smoke
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$APP_PRIVATE_KEY_GITHUB"
          test -n "$APP_ID_GITHUB"
          test -n "$APP_INSTALLATION_ID_GITHUB"
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const apiBase = 'https://api.github.com';
          const owner = process.env.GITHUB_OWNER;
          const repo = process.env.GITHUB_REPOSITORY_NAME;
          const appId = Number(process.env.APP_ID_GITHUB);
          const installationId = Number(process.env.APP_INSTALLATION_ID_GITHUB);
          const privateKey = process.env.APP_PRIVATE_KEY_GITHUB;
          const evidencePath = process.env.EVIDENCE_PATH;
          if (!Number.isSafeInteger(appId) || !Number.isSafeInteger(installationId) || !privateKey.includes('PRIVATE KEY')) throw new Error('Required workflow inputs are invalid.');

          const now = Math.floor(Date.now() / 1000);
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const header = encode({ alg: 'RS256', typ: 'JWT' });
          const claims = encode({ iat: now - 60, exp: now + 540, iss: appId });
          const signingInput = `${header}.${claims}`;
          const signer = crypto.createSign('RSA-SHA256');
          signer.update(signingInput);
          const jwt = `${signingInput}.${signer.sign(privateKey, 'base64url')}`;
          const evidence = [];
          const allowed = new Set([
            `/repos/${owner}/${repo}`,
            `/repos/${owner}/${repo}/pulls?state=all&per_page=10&page=1`,
            `/repos/${owner}/${repo}/issues?state=all&per_page=10&page=1`,
            `/repos/${owner}/${repo}/actions/runs?per_page=10&page=1`,
          ]);

          async function request(method, path, token, body) {
            if (method !== 'GET' && path !== `/app/installations/${installationId}/access_tokens`) throw new Error('Non-allowlisted method.');
            if (method === 'GET' && !allowed.has(path) && path !== '/app' && path !== `/app/installations/${installationId}`) throw new Error('Non-allowlisted endpoint.');
            const started = Date.now();
            const response = await fetch(`${apiBase}${path}`, {
              method,
              headers: { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', Authorization: `Bearer ${token}` },
              body: body ? JSON.stringify(body) : undefined,
              redirect: 'error',
            });
            const text = await response.text();
            let json = null;
            if (text) json = JSON.parse(text);
            if (!response.ok) throw new Error(`${method} ${path} failed with status ${response.status}.`);
            const items = Array.isArray(json) ? json.length : Array.isArray(json?.items) ? json.items.length : Array.isArray(json?.workflow_runs) ? json.workflow_runs.length : undefined;
            evidence.push({ endpointClass: path === '/app' ? 'app.metadata' : path.includes('/installations/') && method === 'GET' ? 'installation.metadata' : path.includes('/pulls') ? 'repository.pull_requests' : path.includes('/issues') ? 'repository.issues' : path.includes('/actions/runs') ? 'repository.actions_runs' : 'repository.metadata', status: response.status, latencyMs: Date.now() - started, itemCount: items });
            return json;
          }

          (async () => {
            const app = await request('GET', '/app', jwt);
            if (app.id !== appId) throw new Error('App ID mismatch.');
            const installation = await request('GET', `/app/installations/${installationId}`, jwt);
            if (installation.id !== installationId || installation.account?.login !== owner || installation.suspended_at || installation.repository_selection !== 'selected') throw new Error('Installation identity or scope mismatch.');
            for (const [permission, level] of Object.entries(installation.permissions || {})) if (level !== 'read') throw new Error(`Unexpected ${permission} permission.`);
            const repositories = installation.repositories || [];
            const target = repositories.find((item) => item.full_name === `${owner}/${repo}`);
            if (!target || repositories.some((item) => item.full_name !== `${owner}/${repo}`)) throw new Error('Repository scope mismatch.');

            const exchange = await request('POST', `/app/installations/${installationId}/access_tokens`, jwt, { repositories: [target.id], permissions: Object.fromEntries(Object.entries(installation.permissions || {}).filter(([, level]) => level === 'read')) });
            if (!exchange.token || !exchange.expires_at || (exchange.repositories && exchange.repositories.some((item) => item.id !== target.id))) throw new Error('Installation token scope mismatch.');
            for (const [permission, level] of Object.entries(exchange.permissions || {})) if (level !== 'read') throw new Error(`Unexpected token ${permission} permission.`);
            const token = exchange.token;
            for (const path of allowed) await request('GET', path, token);
            const sanitized = { gateId: 'GITHUB_ACTIONS_READONLY_SMOKE', appId, installationId, repository: `${owner}/${repo}`, repositoryId: target.id, permissions: Object.fromEntries(Object.entries(exchange.permissions || {}).map(([name, level]) => [name, level === 'read' ? 'read' : 'unexpected'])), endpoints: evidence, zeroWriteClaim: true, credentialsDropped: true, generatedAt: new Date().toISOString() };
            const serialized = JSON.stringify(sanitized, null, 2);
            if (/PRIVATE KEY|Bearer|Authorization|ghs_|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/.test(serialized)) throw new Error('Evidence failed secret scan.');
            fs.writeFileSync(evidencePath, `${serialized}\n`, { flag: 'wx' });
            console.log(`GITHUB_ACTIONS_READONLY_SMOKE=PASS APP_ID=${appId} INSTALLATION_ID=${installationId} REPOSITORY=${owner}/${repo} REPOSITORY_ID=${target.id} ENDPOINT_COUNT=${evidence.length} EVIDENCE_PATH=${evidencePath} CREDENTIALS_DROPPED=true`);
          })().catch((error) => {
            const safeMessage = error instanceof Error ? error.message : 'Unknown smoke failure';
            console.error(`GITHUB_ACTIONS_READONLY_SMOKE=FAIL REASON=${safeMessage}`);
            process.exitCode = 1;
          });
          NODE

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-app-readonly-smoke-evidence
          path: github-app-readonly-smoke-evidence.json
          if-no-files-found: ignore
          retention-days: 7
